<!DOCTYPE html>
<html lang="en">
<!--
  EN: mockup.html — the finished design in plain HTML (only two cards shown).
      Your React app must produce all 12 cards from facts.js.
  中文:mockup.html —— 用纯 HTML 写出的成品设计稿(这里只画了两张卡片)。
      你的 React 应用必须根据 facts.js 生成全部 12 张卡片。
-->
<head>
  <meta charset="UTF-8">
  <title>Fact Board (mockup)</title>
  <link rel="stylesheet" href="normalize.css">
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <header>
    <h1>Fact Board</h1>
    <p>12 facts. Can you guess them before you read the answer?</p>
  </header>

  <div class="board">
    <div class="card">
      <span class="card-number">Fact 1</span><span class="badge">STAR</span>
      <p class="question">Fact question</p>
      <p class="answer">Fact answer</p>
    </div>
    <div class="card">
      <span class="card-number">Fact 2</span>
      <p class="question">Fact question</p>
      <p class="answer">Fact answer</p>
    </div>
  </div>

  <footer>
    <p>Last updated: 11/4/2026</p>
  </footer>
</body>
</html>
