<!DOCTYPE html>
<html lang="en">
<!--
  EN: mockup.html — what your React app should produce, written in plain HTML.
      Open it in the browser to see the design. Only two cards are shown here;
      your app must show all nine questions from questions.js.
  中文:mockup.html —— 你的 React 应用应该做出来的样子,这里用纯 HTML 写出。
      在浏览器打开看设计稿;这里只画了两张卡片,你的应用要显示 questions.js
      里的全部九道题。
-->
<head>
  <meta charset="UTF-8">
  <title>Quiz Board (mockup)</title>
  <link rel="stylesheet" href="normalize.css">
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <header>
    <h1>Quiz Board</h1>
    <p>Nine React questions. Can you answer them before you read the answer?</p>
  </header>

  <div class="board">
    <div class="card">
      <span class="card-number">Question 1</span>
      <p class="question">Quiz question</p>
      <p class="answer">Quiz answer</p>
    </div>
    <div class="card">
      <span class="card-number">Question 2</span>
      <p class="question">Quiz question</p>
      <p class="answer">Quiz answer</p>
    </div>
  </div>

  <footer>
    <p>Generated today: current date</p>
  </footer>
</body>
</html>
