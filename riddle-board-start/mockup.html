<!DOCTYPE html>
<html lang="en">
<!--
  mockup.html: what your React app should produce, written in plain HTML.
  Open it in the browser to see the design. It shows only two cards;
  your app must show all nine riddles from riddles.js.
-->
<head>
  <meta charset="UTF-8">
  <title>Riddle Board (mockup)</title>
  <link rel="stylesheet" href="normalize.css">
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <header>
    <h1>Riddle Board</h1>
    <p>Nine riddles. Can you guess them before you read the answer?</p>
  </header>

  <div class="board">
    <div class="card">
      <span class="card-number">Riddle 1</span>
      <p class="question">Riddle question</p>
      <p class="answer">Riddle answer</p>
    </div>
    <div class="card">
      <span class="card-number">Riddle 2</span>
      <p class="question">Riddle question</p>
      <p class="answer">Riddle answer</p>
    </div>
  </div>

  <footer>
    <p>Generated today: current date</p>
  </footer>
</body>
</html>
